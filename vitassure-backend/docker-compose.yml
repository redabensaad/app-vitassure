version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DB_USER=reda
      - DB_PASSWORD=bensaad
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/vitassure_db
    depends_on:
      - db
    networks:
      - spring-postgres

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=reda
      - POSTGRES_PASSWORD=bensaad
      - POSTGRES_DB=vitassure_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - spring-postgres

volumes:
  postgres-data:

networks:
  spring-postgres:
    driver: bridge